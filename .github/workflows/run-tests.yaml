on:
  push:
    branches:
      - master
  pull_request:

name: Run unit tests

jobs:
  test:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Ubuntu Latest GCC, coverage enabled", 
            os: ubuntu-latest,
            cov: true
          }
        - {
            name: "macOS Latest Clang, debug", 
            os: macos-latest
          }
        - {
            name: "Ubuntu Latest GCC, release", 
            os: ubuntu-latest,
            release: true
          }
        - {
            name: "macOS Latest Clang, release", 
            os: macos-latest,
            release: true
          }

    steps:
    - uses: actions/checkout@v7

    - name: Get latest CMake
      uses: lukka/get-cmake@latest

    - name: Install HDF5 (Ubuntu)
      if: ${{ matrix.config.os == 'ubuntu-latest' }}
      run: |
        sudo apt-get update
        sudo apt-get install libhdf5-dev

    - name: Install HDF5 (Mac)
      if: ${{ matrix.config.os == 'macos-latest' }}
      run: |
        brew install hdf5

    - name: Configure release build
      if: ${{ matrix.config.release }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure debug Mac build
      if: ${{ !matrix.config.release && matrix.config.os == 'macos-latest' }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

    - name: Configure Ubuntu build with code coverage
      if: ${{ matrix.config.cov }}
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCODE_COVERAGE=ON

    - name: Run the build
      run: cmake --build build

    - name: Run the tests
      run: |
        cd build/tests
        # Avoid using ctest because it's so slow; it starts a
        # new process for each individual test, which is crazy.
        for exe in $(ctest --show-only=json-v1 | jq -r ".tests[] | .command | .[0]"  | sort | uniq)
        do
            echo "#### RUNNING ${exe} ####"
            echo 
            ${exe} --gtest_brief=1
            echo
        done 

    - name: Generate code coverage
      if: ${{ matrix.config.cov }}
      run: |
        cd build/tests/CMakeFiles/
        find -type f -name "*.gcno" -execdir gcov -abcfu {} +

    - name: Upload to Codecov
      if: ${{ matrix.config.cov }}
      uses: codecov/codecov-action@v7
      with:
        directory: build/tests/CMakeFiles/
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
